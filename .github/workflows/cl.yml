name: ci

on:
  push:
  repository_dispatch:
    types: [baserow_update]

concurrency:
  group: deploy-site-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          cache: true
      - name: Build the site
        run: pixi run build-ci
        env:
          BASEROW_API_TOKEN: ${{ secrets.BASEROW_API_TOKEN }}
          BASEROW_TABLE_ID: ${{ secrets.BASEROW_TABLE_ID }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  # Only the default branch is published; every other branch stops after the
  # build above, whose artifact can be downloaded from the run summary.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
