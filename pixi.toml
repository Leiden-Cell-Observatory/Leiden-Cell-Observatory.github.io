[workspace]
authors = ["Maarten Paul <maarten.paul@gmail.com>"]
channels = ["conda-forge"]
name = "Leiden-Cell-Observatory.github.io"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
generate = "python scripts/generate_microscopes.py"
build = { cmd = "zensical build -f mkdocs.yml", depends-on = ["generate"] }
build-ci = { cmd = "zensical build -f mkdocs.yml --clean --strict", depends-on = ["generate"] }
serve = { cmd = "zensical serve -f mkdocs.yml", depends-on = ["generate"] }

[dependencies]
python = "==3.12"

[pypi-dependencies]
mkdocs-material = ">=9.7.1, <10"
jinja2 = ">=3.1.6, <4"
requests = ">=2.32.5, <3"
dotenv = ">=0.9.9, <0.10"
zensical = ">=0.0.42, <0.0.43"
